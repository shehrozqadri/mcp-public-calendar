name = "mongodb-certification-portal"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "frontend/build"

# Environment variables - configure via Cloudflare Dashboard or wrangler secret put
# Required secrets (set via `wrangler pages secret put`):
#   MONGO_URL         - MongoDB Atlas connection string
#   DB_NAME           - Database name (mcp-forge)
#   ALLOWED_ORIGIN    - Your production domain (e.g., https://mcp.pages.dev)

[vars]
ENVIRONMENT = "production"
